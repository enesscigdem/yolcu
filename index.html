<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yolcu">
  <meta name="format-detection" content="telephone=no">
  <title>Yolcu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/mavi-180.png">
  <link rel="icon" type="image/png" href="icons/mavi-180.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div id="map"></div>

  <!-- Üst: konum + hava (tek satır) -->
  <button id="where-pill" class="where surface" data-act="openWhere" hidden>
    <span id="where-road">Konum alınıyor…</span>
    <span id="weather" class="wx"></span>
  </button>

  <!-- Sağ üst kontroller -->
  <div id="controls" class="controls surface">
    <button id="btn-layers" data-act="openLayers" aria-label="Harita görünümü"></button>
    <div class="ctl-sep"></div>
    <button id="btn-3d" class="t3d" data-act="toggle3d" aria-label="3B görünüm">3B</button>
    <div class="ctl-sep"></div>
    <button id="btn-locate" data-act="locate" aria-label="Konumuma git"></button>
  </div>

  <div id="layers" class="layers" hidden></div>

  <!-- Alt panel -->
  <section id="sheet" class="sheet" data-detent="peek">
    <div class="grab-area"><div class="grabber"></div></div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <!-- Navigasyon -->
  <div id="nav" class="nav" hidden>
    <div class="nav-card">
      <div class="nav-main">
        <div id="nav-icon" class="nav-icon"></div>
        <div class="nav-text">
          <div id="nav-dist" class="nav-dist"></div>
          <div id="nav-action" class="nav-action"></div>
          <div id="nav-road" class="nav-road"></div>
        </div>
      </div>
      <div id="nav-then" class="nav-then" hidden></div>
    </div>
    <div id="nav-alert" class="nav-alert" hidden></div>
    <div id="nav-status" class="nav-status" hidden></div>
  </div>

  <div id="nav-side" class="nav-side" hidden>
    <button id="nav-overview" class="round" data-act="overview" aria-label="Tüm rota"></button>
    <button id="nav-mute" class="round" data-act="toggleVoice" aria-label="Ses"></button>
  </div>

  <button id="nav-recenter" class="recenter" data-act="recenter" hidden>Ortala</button>
  <div id="nav-street" class="street-pill" hidden></div>

  <div id="nav-bottom" class="nav-bottom" hidden>
    <div class="grabber"></div>
    <button class="nav-stats" data-act="toggleNavMenu" aria-label="Seçenekler">
      <span class="stat speed"><span id="speed-limit" class="limit" hidden></span><span><b id="speed-val">0</b><small>km/sa</small></span></span>
      <span class="stat eta"><b id="nav-eta">--:--</b><small>varış</small></span>
      <span class="stat"><b id="nav-rem">--</b><small id="nav-rem-u">dk</small></span>
      <span class="stat"><b id="nav-km">--</b><small id="nav-km-u">km</small></span>
    </button>
    <div id="nav-menu" class="nav-menu" hidden></div>
  </div>

  <!-- Ayarlar -->
  <div id="settings" class="page" hidden>
    <div class="page-head">
      <button class="link" data-act="closeSettings">Kapat</button>
      <h1>Ayarlar</h1>
      <span></span>
    </div>
    <div id="settings-body" class="page-body"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input id="file-import" type="file" accept="application/json,.json" hidden>
</div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

name: Radar verisini güncelle

# Her pazartesi EGM'nin resmi EDS haritasından radar noktalarını çeker,
# değiştiyse data/radars-tr.json dosyasını günceller.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/update-radars.mjs
      - name: Değiştiyse kaydet
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "yolcu-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/radars-tr.json
            git commit -m "Radar verisi güncellendi (EGM)"
            git push
          fi

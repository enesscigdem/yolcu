<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yolcu · Telefon önizlemesi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#E7E3DA;color:#292929;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;display:flex;align-items:center;flex-direction:column;min-height:100dvh;padding:10px 8px;gap:9px}header{width:min(390px,100%)}p{font-size:11px;color:#6B655E;margin:0 0 7px;text-align:center}nav{display:flex;gap:6px}button{font-family:inherit;font-size:13px;font-weight:600;flex:1;height:35px;background:#F7F4EE;border:1px solid #D8D1C6;border-radius:11px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#C95D36;color:#FFF;border-color:#C95D36}main{width:min(390px,100%);height:min(844px,calc(100dvh - 135px));min-height:400px;border-radius:27px;overflow:hidden;box-shadow:0 8px 35px #45392224;border:1px solid #D3CCC0;background:#F7F4EE}iframe{border:0;width:100%;height:100%;display:block}a{color:#8D492F;font-size:11px;text-decoration:none}
.diagnostics-toggle{height:24px;font-size:10px;margin-top:4px;background:transparent;border:0;color:#6b655e;width:100%}</style>
</head>
<body>
<header><p>İzmir test konumu · Canlı rota · Sürüş simülasyonu</p><nav aria-label="Önizleme ekranı"><button data-screen="home" aria-pressed="true">Ana ekran</button><button data-screen="routes" aria-pressed="false">Rota seçimi</button><button data-screen="drive" aria-pressed="false">Sürüş ekranı</button></nav><button id="diagnostics-toggle" class="diagnostics-toggle">Ölçümler</button></header>
<main><iframe src="index.html?preview=1" title="Yolcu telefon ekranı" allow="fullscreen"></iframe></main>
<a href="/" target="_blank" rel="noopener">Uygulamayı normal modda aç ↗</a>
<script>
const frame=document.querySelector('iframe');
let active='home';
function select(screen){active=screen;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===screen)));frame.contentWindow.postMessage({type:'yolcu-preview',screen},location.origin);}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-screen]');if(b)select(b.dataset.screen);});
document.querySelector('#diagnostics-toggle').addEventListener('click',()=>frame.contentWindow.postMessage({type:'yolcu-preview',screen:'diagnostics'},location.origin));
frame.addEventListener('load',()=>select(active));
</script>
</body></html>
